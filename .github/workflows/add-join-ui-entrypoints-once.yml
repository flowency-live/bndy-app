name: Add Join bndy UI entrypoints once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Run Join bndy UI entrypoints')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Add clearly separated Join entrypoints
        run: |
          node <<'NODE'
          const fs = require('fs');

          // 1) Signed-in account menu: make management and onboarding two different actions.
          {
            const p = 'src/features/auth/UserButton.tsx';
            let s = fs.readFileSync(p, 'utf8');
            s = s.replace(
              'import { CircleHelp, History, LogOut, Settings, SlidersHorizontal, UserCog, UserRound, X } from "lucide-react";',
              'import { BadgePlus, CircleHelp, History, LogOut, Settings, SlidersHorizontal, UserCog, UserRound, X } from "lucide-react";'
            );
            s = s.replace(
              '<Link role="menuitem" href="/manage" onClick={() => setOpen(false)} className="flex w-full items-center gap-2 rounded-lg px-2 py-2 text-[13.5px] font-bold text-dim transition-colors hover:bg-white/5 hover:text-txt"><UserCog size={16} />Artists & venues</Link>',
              '<Link role="menuitem" href="/manage" onClick={() => setOpen(false)} className="flex w-full items-center gap-2 rounded-lg px-2 py-2 text-[13.5px] font-bold text-dim transition-colors hover:bg-white/5 hover:text-txt"><UserCog size={16} />Manage artists & venues</Link>\n          <Link role="menuitem" href="/join" onClick={() => setOpen(false)} className="flex w-full items-center gap-2 rounded-lg px-2 py-2 text-[13.5px] font-bold text-[var(--acc-text)] transition-colors hover:bg-white/5"><BadgePlus size={16} />Join as artist or venue</Link>'
            );
            if (!s.includes('Join as artist or venue')) throw new Error('UserButton Join link patch failed');
            fs.writeFileSync(p, s);
          }

          // 2) Login page: preserve the current consumer signup, but explain that BAV onboarding is separate and uses the same account.
          {
            const p = 'src/app/login/LoginClient.tsx';
            let s = fs.readFileSync(p, 'utf8');
            if (!s.includes('import Link from "next/link";')) s = s.replace('import { useEffect } from "react";', 'import { useEffect } from "react";\nimport Link from "next/link";');
            const anchor = '      <LoginPanel nextPath={next} />';
            if (!s.includes('Are you an artist or venue?')) {
              if (!s.includes(anchor)) throw new Error('Login panel anchor missing');
              s = s.replace(anchor, `${anchor}\n      <div className="mx-auto mt-5 w-full max-w-sm rounded-2xl border border-[var(--acc)]/35 bg-[color-mix(in_srgb,var(--acc)_7%,transparent)] p-4">\n        <div className="text-[12px] font-black text-txt">Are you an artist or venue?</div>\n        <p className="mt-1 text-[11px] font-semibold leading-relaxed text-dim">This sign-in is your normal bndy account for favourites, filters and personal features. To add, find or claim an artist or venue, use the separate Join journey. It uses this same account.</p>\n        <Link href="/join" className="mt-3 inline-flex min-h-9 items-center rounded-xl bg-acc px-3 text-[11px] font-black text-on-acc">Join bndy as an artist or venue →</Link>\n      </div>`);
            }
            if (!s.includes('Join bndy as an artist or venue')) throw new Error('Login Join callout patch failed');
            fs.writeFileSync(p, s);
          }

          // 3) Desktop sidebar: prominent BAV CTA immediately below the normal user account control.
          {
            const p = 'src/components/app-shell.tsx';
            let s = fs.readFileSync(p, 'utf8');
            const anchor = '        <div className="mb-3 shrink-0">\n          <UserButton variant="sidebar" />\n        </div>';
            if (!s.includes('Artist or venue?')) {
              if (!s.includes(anchor)) throw new Error('Sidebar account anchor missing');
              s = s.replace(anchor, `${anchor}\n        <Link href="/join" className="mb-4 shrink-0 rounded-2xl border border-[var(--acc)]/35 bg-[color-mix(in_srgb,var(--acc)_7%,transparent)] px-3 py-3 transition hover:border-[var(--acc)] hover:bg-[color-mix(in_srgb,var(--acc)_11%,transparent)]">\n          <span className="block text-[10px] font-black uppercase tracking-[1.1px] text-[var(--acc-text)]">Artist or venue?</span>\n          <span className="mt-0.5 block text-[13px] font-black text-txt">Join bndy →</span>\n          <span className="mt-1 block text-[10.5px] font-semibold leading-snug text-dim">Find, claim or create your page. Your normal user features come with it.</span>\n        </Link>`);
            }
            if (!s.includes('Your normal user features come with it.')) throw new Error('Sidebar Join CTA patch failed');
            fs.writeFileSync(p, s);
          }
          NODE
      - name: Verify release
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Commit product changes
        run: |
          git config user.name 'bndy-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/features/auth/UserButton.tsx src/app/login/LoginClient.tsx src/components/app-shell.tsx
          git commit -m 'Differentiate user signup from Artist and Venue Join'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
