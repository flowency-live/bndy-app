name: Apply Claim V2 evidence UI
on:
  push:
    branches: [claim-v2-evidence]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[claim-v2-apply]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claim-v2-evidence }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/apply-claim-v2.js
      - run: node scripts/post-claim-v2-fix.js
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --runInBand
        continue-on-error: true
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name 'bndy-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/features/auth/AuthGate.tsx src/features/join/ClaimEvidenceStep.tsx src/features/join/joinApi.ts src/features/join/JoinArtistFlow.tsx src/features/join/JoinVenueFlow.tsx
          git commit -m 'Implement evidence-led Claim V2 UI'
          git push origin HEAD:claim-v2-evidence
