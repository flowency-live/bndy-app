name: Apply Facebook login UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-facebook-login-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Facebook login UI
        run: |
          node <<'NODE'
          const fs = require('fs');
          const apiPath = 'src/lib/auth/authApi.ts';
          const panelPath = 'src/features/auth/LoginPanel.tsx';
          let api = fs.readFileSync(apiPath, 'utf8');
          let panel = fs.readFileSync(panelPath, 'utf8');

          function replaceOnce(source, from, to, label) {
            if (source.includes(to)) return source;
            if (!source.includes(from)) throw new Error(`Anchor not found for ${label}`);
            return source.replace(from, to);
          }

          api = replaceOnce(
            api,
            "export function googleAuthUrl(nextPath: string): string {\n  return `${BASE}/auth/google?returnTo=${encodeURIComponent(returnTo(nextPath))}`;\n}\n\nexport function appleAuthUrl(nextPath: string): string {",
            "export function googleAuthUrl(nextPath: string): string {\n  return `${BASE}/auth/google?returnTo=${encodeURIComponent(returnTo(nextPath))}`;\n}\n\nexport function facebookAuthUrl(nextPath: string): string {\n  return `${BASE}/auth/facebook?returnTo=${encodeURIComponent(returnTo(nextPath))}`;\n}\n\nexport function appleAuthUrl(nextPath: string): string {",
            'facebook auth URL helper'
          );

          panel = replaceOnce(
            panel,
            'import { appleAuthUrl, googleAuthUrl, requestMagicLink, requestPhoneOtp, verifyPhoneAndOnboard, verifyPhoneOtp } from "@/lib/auth/authApi";',
            'import { appleAuthUrl, facebookAuthUrl, googleAuthUrl, requestMagicLink, requestPhoneOtp, verifyPhoneAndOnboard, verifyPhoneOtp } from "@/lib/auth/authApi";',
            'facebook auth import'
          );

          const appleAnchor = '          <a href={appleAuthUrl(nextPath)} className="flex w-full items-center justify-center gap-2 rounded-xl bg-black px-4 py-3 text-[15px] font-bold text-white transition-colors hover:bg-gray-900">';
          const facebookBlock = `          <a href={facebookAuthUrl(nextPath)} className="flex w-full items-center justify-center gap-2 rounded-xl bg-[#1877F2] px-4 py-3 text-[15px] font-bold text-white transition-opacity hover:opacity-90">\n            <svg className="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8h2.75l.41-3H13.5V9.08c0-.87.24-1.46 1.58-1.46H16.8V4.94c-.3-.04-1.32-.13-2.51-.13-2.49 0-4.19 1.52-4.19 4.31V11H7.25v3h2.85v8h3.4Z"/></svg>\n            Continue with Facebook\n          </a>\n`;
          if (!panel.includes('Continue with Facebook')) {
            panel = replaceOnce(panel, appleAnchor, facebookBlock + appleAnchor, 'facebook login button');
          }

          fs.writeFileSync(apiPath, api);
          fs.writeFileSync(panelPath, panel);
          NODE
      - name: Verify frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand || npm test
          npm run build
          grep -q 'facebookAuthUrl' src/lib/auth/authApi.ts
          grep -q 'Continue with Facebook' src/features/auth/LoginPanel.tsx
      - name: Commit frontend changes
        run: |
          git config user.name 'bndy-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/auth/authApi.ts src/features/auth/LoginPanel.tsx
          git commit -m 'Add Facebook as a BNDY login provider'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
