# One-shot patch workflow: second trigger runs now that the workflow exists on main.
name: Apply Facebook login UI once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Trigger Facebook login UI patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Facebook login UI
        run: |
          node <<'NODE'
          const fs = require('fs');
          const apiPath = 'src/lib/auth/authApi.ts';
          const panelPath = 'src/features/auth/LoginPanel.tsx';
          let api = fs.readFileSync(apiPath, 'utf8');
          let panel = fs.readFileSync(panelPath, 'utf8');

          function replaceOnce(source, from, to, label) {
            if (source.includes(to)) return source;
            if (!source.includes(from)) throw new Error(`Anchor not found for ${label}`);
            return source.replace(from, to);
          }

          api = replaceOnce(
            api,
            "export function googleAuthUrl(nextPath: string): string {\n  return `${BASE}/auth/google?returnTo=${encodeURIComponent(returnTo(nextPath))}`;\n}\n\nexport function appleAuthUrl(nextPath: string): string {",
            "export function googleAuthUrl(nextPath: string): string {\n  return `${BASE}/auth/google?returnTo=${encodeURIComponent(returnTo(nextPath))}`;\n}\n\nexport function facebookAuthUrl(nextPath: string): string {\n  return `${BASE}/auth/facebook?returnTo=${encodeURIComponent(returnTo(nextPath))}`;\n}\n\nexport function appleAuthUrl(nextPath: string): string {",
            'facebook auth URL helper'
          );

          panel = replaceOnce(
            panel,
            'import { appleAuthUrl, googleAuthUrl, requestMagicLink, requestPhoneOtp, verifyPhoneAndOnboard, verifyPhoneOtp } from "@/lib/auth/authApi";',
            'import { appleAuthUrl, facebookAuthUrl, googleAuthUrl, requestMagicLink, requestPhoneOtp, verifyPhoneAndOnboard, verifyPhoneOtp } from "@/lib/auth/authApi";',
            'facebook auth import'
          );

          const googleBlock = `          <a href={googleAuthUrl(nextPath)} className="flex w-full items-center justify-center gap-2 rounded-xl bg-white px-4 py-3 text-[15px] font-bold text-gray-900 transition-colors hover:bg-gray-50">\n            <svg className="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 0 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>\n            Continue with Google\n          </a>\n`;
          const facebookBlock = `${googleBlock}          <a href={facebookAuthUrl(nextPath)} className="flex w-full items-center justify-center gap-2 rounded-xl bg-[#1877F2] px-4 py-3 text-[15px] font-bold text-white transition-opacity hover:opacity-90">\n            <svg className="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8h2.75l.41-3H13.5V9.08c0-.87.24-1.46 1.58-1.46H16.8V4.94c-.3-.04-1.32-.13-2.51-.13-2.49 0-4.19 1.52-4.19 4.31V11H7.25v3h2.85v8h3.4Z"/></svg>\n            Continue with Facebook\n          </a>\n`;
          panel = replaceOnce(panel, googleBlock, facebookBlock, 'facebook login button');

          fs.writeFileSync(apiPath, api);
          fs.writeFileSync(panelPath, panel);
          NODE
      - name: Verify frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- --runInBand || npm test
          npm run build
          grep -q 'facebookAuthUrl' src/lib/auth/authApi.ts
          grep -q 'Continue with Facebook' src/features/auth/LoginPanel.tsx
      - name: Commit frontend changes
        run: |
          git config user.name 'bndy-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/lib/auth/authApi.ts src/features/auth/LoginPanel.tsx
          git commit -m 'Add Facebook as a BNDY login provider'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
