name: Patch Claim V2 Manage evidence follow-up
on:
  push:
    branches: [claim-v2-more-evidence]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[claim-more-evidence]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claim-v2-more-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-claim-more-evidence.js
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Commit
        run: |
          git config user.name 'bndy-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/features/join/ManageEntitiesPage.tsx
          git commit -m 'Complete Claim V2 evidence follow-up in Manage'
          git push origin HEAD:claim-v2-more-evidence
