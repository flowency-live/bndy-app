name: Patch Claim V2 Manage status once
on:
  push:
    branches: [claim-v2-evidence]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[claim-v2-manage]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: claim-v2-evidence }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Patch Manage reviewable statuses
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/features/join/ManageEntitiesPage.tsx';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('claims.filter((claim) => claim.status === "pending").length > 0','claims.filter((claim) => ["pending", "pending_review", "verified_pending", "more_evidence_required", "conflict"].includes(claim.status)).length > 0');
          s=s.replace('claims.filter((claim) => claim.status === "pending").map((claim)', 'claims.filter((claim) => ["pending", "pending_review", "verified_pending", "more_evidence_required", "conflict"].includes(claim.status)).map((claim)');
          s=s.replace('{claim.entity_type} · pending verification', '{claim.entity_type} · {claim.status === "verified_pending" ? "verification captured" : "evidence being checked"}');
          fs.writeFileSync(p,s);
          NODE
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Commit
        run: |
          git config user.name 'bndy-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/features/join/ManageEntitiesPage.tsx
          git commit -m 'Show Claim V2 review states in Manage'
          git push origin HEAD:claim-v2-evidence
