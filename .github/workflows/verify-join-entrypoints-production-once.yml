name: Verify Join entrypoints production once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: contains(github.event.head_commit.message, 'Run Join entrypoint production verification')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait for bndy.live deployment
        run: |
          PASS=false
          LOGIN=000
          JOIN=000
          for i in $(seq 1 30); do
            LOGIN=$(curl -L -sS -o /tmp/login.html -w '%{http_code}' https://bndy.live/login || true)
            JOIN=$(curl -L -sS -o /tmp/join.html -w '%{http_code}' https://bndy.live/join || true)
            if [[ "$LOGIN" == '200' && "$JOIN" == '200' ]] && grep -q 'Are you an artist or venue?' /tmp/login.html && grep -q 'Join bndy' /tmp/join.html; then
              PASS=true
              break
            fi
            sleep 20
          done
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=$PASS"
            echo "login=$LOGIN"
            echo "join=$JOIN"
            echo "login_has_bav_split=$(grep -q 'Are you an artist or venue?' /tmp/login.html && echo true || echo false)"
            echo "join_has_entry=$(grep -q 'Join bndy' /tmp/join.html && echo true || echo false)"
          } > JOIN-BNDY-ENTRYPOINT-PRODUCTION.txt
          [[ "$PASS" == 'true' ]]
      - name: Record production verification
        run: |
          git config user.name 'bndy-product-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add JOIN-BNDY-ENTRYPOINT-PRODUCTION.txt
          git commit -m 'Record Join entrypoint production verification'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
